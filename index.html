<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>迷雾遗迹 · 异步寻宝</title><link rel="stylesheet" href="style.css"><script src="treasure.js" defer></script></head>
<body><main><header><span>THE LOST EXPEDITION / 交互式寻宝</span><b>JavaScript · async / await</b></header><section class="intro"><p class="eyebrow">一张地图，一场未知的冒险</p><h1>迷雾之中，<br>寻找失落的宝藏。</h1><p>解读古老文字，渡过迷雾河，接受守卫的考验。<br>每一次等待，都让你离真相更近一步。</p></section><section class="game"><div class="map"><div class="moon"></div><div class="mountain m1"></div><div class="mountain m2"></div><div class="river"></div><div class="trail"></div><div class="place p0">📚<small>古老图书馆</small></div><div class="place p1">📜<small>符文石碑</small></div><div class="place p2">⛵<small>迷雾河</small></div><div class="place p3">🏛️<small>遗失神庙</small></div><div class="place p4">🗝️<small>月光密室</small></div><div class="place p5">🎁<small>传说宝藏</small></div><div id="traveler" aria-hidden="true">🧭</div><div class="map-label">北境 · 失落群岛 <span>✧ N</span></div><div id="celebration" hidden>✦ 宝藏已苏醒 ✦</div></div><aside><div class="panel-title"><span>探险手记</span><span id="status" role="status">准备出发</span></div><div class="progress"><i id="bar"></i></div><p id="step">0 / 6 个地点</p><div id="log" role="log" aria-live="polite"><p class="hint">你的旅程，将从图书馆的旧书架开始。</p></div><form id="riddle" hidden><label for="answer">什么东西越洗越脏？</label><div><input id="answer" placeholder="输入谜底" autocomplete="off" required><button>提交</button></div><small>提示：用来清洗东西的液体。</small></form><div class="controls"><button id="start" type="button">开始探险 ↗</button><button id="retry" type="button" hidden>重新探险 ↻</button><label><input id="guard" type="checkbox"> 必定遇到守卫（演示）</label></div></aside></section><footer><span>探索 · 解谜 · 发现</span><span>课程实践 / Promise + async/await + DOM 动画</span></footer></main></body></html>
